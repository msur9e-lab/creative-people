    <meta name="theme-color" content="#071c43" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('mabdeen_theme') || localStorage.getItem('saleka_theme') || localStorage.getItem('mansa_theme');
          const dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch {}
      })();
    </script>
    <script>
      (() => {
        const match = window.location.search.match(/[?&]__spa=([^&]*)/);
        if (!match) return;
        try {
          const target = decodeURIComponent(match[1]);
          if (target.startsWith('/') && !target.startsWith('//')) window.history.replaceState(null, '', target);
        } catch {}
      })();
    </script>
